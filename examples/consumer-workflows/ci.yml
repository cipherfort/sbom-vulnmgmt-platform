# For Terraform repos only; everything else is collected without any CI change.
# Copy to your repo, point <your-org>/<your-repo> at this platform repo, and set
# the DEPENDENCY_TRACK_URL variable and DEPENDENCY_TRACK_API_KEY secret.

name: CI

on:
  pull_request:

jobs:
  sbom-scan:
    uses: <your-org>/<your-repo>/.github/workflows/sbom-scan.yml@main
    with:
      sbom_type: terraform
      project_version: pr-${{ github.event.pull_request.number }}
      dependency_track_url: ${{ vars.DEPENDENCY_TRACK_URL }}
    secrets:
      dependency_track_api_key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
