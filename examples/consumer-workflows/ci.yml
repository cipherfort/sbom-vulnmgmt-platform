# Sample CI workflow for a Terraform (or npm) repo using this platform.
#
# Only needed for Terraform: GitHub's dependency graph has no Terraform
# ecosystem, so the enterprise collector can't see providers. Every other
# ecosystem the dependency graph supports is collected centrally each night
# with no change to your repo.
#
# Copy into <your-repo>/.github/workflows/ci.yml, replace <your-org>/
# <your-repo> below with wherever THIS platform repo lives, and set on the
# repo (or once at org level):
#
#   Variable: DEPENDENCY_TRACK_URL
#   Secret:   DEPENDENCY_TRACK_API_KEY  (the ci-uploader team's key, from CPS)
#
# This is the PR-triggered half: project_version is pr-<number>, so you can
# compare a PR's providers with main before merging. See cd.yml for the
# merge-triggered half.

name: CI

on:
  pull_request:

jobs:
  sbom-scan:
    uses: <your-org>/<your-repo>/.github/workflows/sbom-scan.yml@main
    with:
      sbom_type: terraform # or: npm — see docs/how-to-use.md
      project_version: pr-${{ github.event.pull_request.number }}
      dependency_track_url: ${{ vars.DEPENDENCY_TRACK_URL }}
    secrets:
      dependency_track_api_key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}

  # Whatever this repo's existing PR checks are — Checkov, lint, tests —
  # keep running as their own independent jobs alongside sbom-scan.
