# Sample CD workflow for a Terraform (or npm) repo using this platform.
#
# Copy into <your-repo>/.github/workflows/cd.yml — same variable and secret
# as ci.yml (see that file's header). The only difference from ci.yml:
# project_version is "main", which is the version your team's dashboards
# and triage should follow.

name: CD

on:
  push:
    branches: [main]

jobs:
  sbom-scan:
    uses: <your-org>/<your-repo>/.github/workflows/sbom-scan.yml@main
    with:
      sbom_type: terraform # or: npm — see docs/how-to-use.md
      project_version: main
      dependency_track_url: ${{ vars.DEPENDENCY_TRACK_URL }}
    secrets:
      dependency_track_api_key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}

  # Whatever this repo's existing deploy steps are (terraform apply, ...)
  # keep running as their own independent job(s) alongside sbom-scan.
