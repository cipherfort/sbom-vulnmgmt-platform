name: Bug report
description: Something in this repo's Terraform, workflows, or scripts isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug, including what you expected instead
    validations:
      required: true

  - type: dropdown
    id: deployment-mode
    attributes:
      label: Deployment mode
      options:
        - examples/standalone (deployable root)
        - modules/platform, composed into my own Terraform
        - Not sure / not applicable
    validations:
      required: true

  - type: textarea
    id: flags
    attributes:
      label: Which optional flags are enabled?
      description: name_prefix, enable_private_networking, high_availability_enabled, etc. — the specific combination matters a lot for infra bugs
      placeholder: |
        name_prefix = "..."
        enable_private_networking = true/false
        high_availability_enabled = true/false

  - type: input
    id: terraform-version
    attributes:
      label: Terraform version
      placeholder: terraform version

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / terraform output
      description: Paste the relevant plan/apply output or error message. This will be rendered as a code block, no need to add backticks.
      render: shell
