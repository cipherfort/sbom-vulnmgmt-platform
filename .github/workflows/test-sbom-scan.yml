name: Test SBOM Scan

# Manual test of sbom-scan.yml on this repo's own Terraform. Needs the
# DEPENDENCY_TRACK_URL variable and DEPENDENCY_TRACK_API_KEY secret.

on:
  workflow_dispatch:

jobs:
  sbom-scan:
    uses: ./.github/workflows/sbom-scan.yml
    with:
      sbom_type: terraform
      project_version: main
      working_directory: .
      dependency_track_url: ${{ vars.DEPENDENCY_TRACK_URL }}
    secrets:
      dependency_track_api_key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
