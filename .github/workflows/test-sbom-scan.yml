# One-off manual test of the sbom-scan.yml reusable workflow, using this
# repo's own Terraform as the guinea pig — no second repo needed. Calls the
# reusable workflow via a same-repo relative path, so it works regardless
# of what this repo's actual GitHub org/name is.
#
# Run it: Actions tab -> "Test SBOM Scan" -> Run workflow.
#
# Requires these set on THIS repo (Settings > Secrets and variables >
# Actions) before running:
#   Variables: DEPENDENCY_TRACK_URL, DEFECTDOJO_URL, DEFECTDOJO_PRODUCT_NAME,
#              DEFECTDOJO_PRODUCT_TYPE_NAME (only needed until the product
#              below exists in DefectDojo for the first time)
#   Secrets:   DEPENDENCY_TRACK_API_KEY, DEFECTDOJO_API_KEY

name: Test SBOM Scan

on:
  workflow_dispatch:

jobs:
  sbom-scan:
    uses: ./.github/workflows/sbom-scan.yml
    with:
      sbom_type: terraform
      project_name: sbom-vulnmgmt-platform-selftest
      project_version: main
      working_directory: .
      dependency_track_url: ${{ vars.DEPENDENCY_TRACK_URL }}
      defectdojo_url: ${{ vars.DEFECTDOJO_URL }}
      defectdojo_product_name: ${{ vars.DEFECTDOJO_PRODUCT_NAME }}
      defectdojo_product_type_name: ${{ vars.DEFECTDOJO_PRODUCT_TYPE_NAME }}
      import_to_defectdojo: true
    secrets:
      dependency_track_api_key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
      defectdojo_api_key: ${{ secrets.DEFECTDOJO_API_KEY }}
