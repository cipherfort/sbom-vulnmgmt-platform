name: Reusable SBOM Scan

# Called from other repos as:
#   uses: sg-cloud-platform/cps-security-platform-infra/.github/workflows/sbom-scan.yml@main
#   with:
#     sbom_type: terraform            # or: npm
#     project_version: pr-${{ github.event.pull_request.number }}   # or "main" on the default-branch run
#     dependency_track_url: ${{ vars.DEPENDENCY_TRACK_URL }}
#   secrets:
#     dependency_track_api_key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}   # the ci-uploader team's key
#
# Why this still exists next to the enterprise collector (ADR-0002): the
# collector reads GitHub's dependency graph, and the dependency graph has no
# Terraform ecosystem. This workflow builds the Terraform SBOM from
# .terraform.lock.hcl and uploads it to the same Dependency-Track.
#
# Project naming: "<org>/<repo>/<sbom_type>" under the org's parent project
# "<org>". The collector owns "<org>/<repo>" for the dependency-graph SBOM;
# a different name here stops the two uploads replacing each other's
# components. The org parent must already exist (the collector creates it on
# its first run for the org, or dtrack_admin.py onboard-org does).
#
# Runs on cps-ubuntu-latest-private because Dependency-Track is internal-only:
# the runner needs a network path to the Container Apps environment.
on:
  workflow_call:
    inputs:
      sbom_type:
        description: "terraform (custom lock-file parser) | npm (cdxgen)"
        type: string
        required: true
      project_version:
        type: string
        required: true
      project_name:
        description: "Override the Dependency-Track project name. Default: <org>/<repo>/<sbom_type>"
        type: string
        default: ""
      parent_project:
        description: "Override the parent project. Default: the repo's org"
        type: string
        default: ""
      working_directory:
        type: string
        default: "."
      dependency_track_url:
        description: "Dependency-Track API URL, with or without https://"
        type: string
        required: true
    secrets:
      dependency_track_api_key:
        required: true

jobs:
  sbom-scan:
    name: Generate & Upload SBOM
    runs-on: cps-ubuntu-latest-private

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: inputs.sbom_type == 'npm'
        with:
          node-version: "20"

      - name: Generate CycloneDX SBOM (npm)
        if: inputs.sbom_type == 'npm'
        working-directory: ${{ inputs.working_directory }}
        run: npx --yes @cyclonedx/cdxgen@10 -t npm -o bom.json .

      - uses: hashicorp/setup-terraform@v3
        if: inputs.sbom_type == 'terraform'
        with:
          terraform_wrapper: false

      - name: Resolve providers (populates .terraform.lock.hcl if not already committed)
        if: inputs.sbom_type == 'terraform'
        working-directory: ${{ inputs.working_directory }}
        run: terraform init -backend=false -input=false

      - name: Generate CycloneDX SBOM (terraform)
        if: inputs.sbom_type == 'terraform'
        working-directory: ${{ inputs.working_directory }}
        run: |
          python3 - .terraform.lock.hcl bom.json <<'PYEOF'
          import json, re, sys, uuid, urllib.request

          lock_path, out_path = sys.argv[1], sys.argv[2]

          with open(lock_path) as f:
              content = f.read()

          provider_re = re.compile(r'provider\s+"([^"]+)"\s*\{(.*?)\n\}', re.DOTALL)
          version_re = re.compile(r'version\s*=\s*"([^"]+)"')
          hash_re = re.compile(r'"(h1:[^"]+)"')


          def registry_source(namespace, ptype):
              url = f"https://registry.terraform.io/v1/providers/{namespace}/{ptype}"
              try:
                  with urllib.request.urlopen(url, timeout=10) as resp:
                      data = json.load(resp)
                      source = data.get("source", "")
                      if source.startswith("https://github.com/"):
                          return source[len("https://github.com/"):]
              except Exception as e:
                  print(f"::warning::Registry lookup failed for {namespace}/{ptype}: {e}", file=sys.stderr)
              return None


          components = []
          for m in provider_re.finditer(content):
              address = m.group(1)
              block = m.group(2)
              vm = version_re.search(block)
              if not vm:
                  continue
              version = vm.group(1)
              hashes = hash_re.findall(block)

              parts = address.split("/")
              if len(parts) != 3:
                  continue
              host, namespace, ptype = parts

              if host == "registry.terraform.io":
                  gh_path = registry_source(namespace, ptype) or f"{namespace}/terraform-provider-{ptype}"
                  gh_owner, gh_repo = gh_path.split("/", 1)
                  purl = f"pkg:golang/github.com/{gh_owner}/{gh_repo}@v{version}"
                  group, name = gh_owner, gh_repo
              else:
                  purl = f"pkg:generic/{host}/{namespace}/{ptype}@{version}"
                  group, name = namespace, ptype

              props = [{"name": "terraform:provider_address", "value": address}]
              if hashes:
                  props.append({"name": "terraform:lock_hash", "value": hashes[0]})

              components.append({
                  "type": "library",
                  "group": group,
                  "name": name,
                  "version": version,
                  "purl": purl,
                  "properties": props,
              })

          bom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "serialNumber": f"urn:uuid:{uuid.uuid4()}",
              "version": 1,
              "components": components,
          }

          with open(out_path, "w") as f:
              json.dump(bom, f, indent=2)

          print(f"Wrote {len(components)} provider components to {out_path}")
          if not components:
              print("::warning::No provider components found in .terraform.lock.hcl")
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: ${{ inputs.working_directory }}/bom.json
          retention-days: 30

      - name: Resolve Dependency-Track target
        id: target
        env:
          DT_URL: ${{ inputs.dependency_track_url }}
          PROJECT_NAME: ${{ inputs.project_name }}
          PARENT: ${{ inputs.parent_project }}
          SBOM_TYPE: ${{ inputs.sbom_type }}
        # gh-upload-sbom v4 takes a bare hostname; DEPENDENCY_TRACK_URL is
        # usually set as a full https:// URL, so strip the scheme and any
        # trailing slash here instead of making every caller get it right.
        run: |
          set -euo pipefail
          host="${DT_URL#https://}"; host="${host#http://}"; host="${host%/}"
          {
            echo "host=$host"
            echo "project=${PROJECT_NAME:-$GITHUB_REPOSITORY/$SBOM_TYPE}"
            echo "parent=${PARENT:-$GITHUB_REPOSITORY_OWNER}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload SBOM to Dependency-Track
        # Pinned by commit SHA, as with trivy-action in image-scan.yml.
        uses: DependencyTrack/gh-upload-sbom@331f980a6eba119842052f447c54b09e4888b4c6 # v4.3.0
        with:
          server-hostname: ${{ steps.target.outputs.host }}
          api-key: ${{ secrets.dependency_track_api_key }}
          project-name: ${{ steps.target.outputs.project }}
          project-version: ${{ inputs.project_version }}
          parent-name: ${{ steps.target.outputs.parent }}
          bom-filename: ${{ inputs.working_directory }}/bom.json
          auto-create: true
