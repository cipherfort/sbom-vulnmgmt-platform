name: SBOM Platform CD

# Terraform plan/apply, then the collector code. Runs on merges to main that
# change Terraform or the collector, or by hand (Actions > Run workflow).
# Only runs from main can sign in to Azure; protect main with required reviews.

on:
  push:
    branches: [main]
    paths:
      - "*.tf"
      - ".terraform.lock.hcl"
      - "sbom-collector/**"
      - ".github/workflows/cd.yml"

  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        required: true
        options: [plan, apply]

env:
  TERRAFORM_VERSION: "1.11.4"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Terraform (${{ github.event.inputs.action || 'apply' }})
    runs-on: cps-ubuntu-latest-private

    # One Terraform run at a time, and never cancel one mid-apply.
    concurrency:
      group: security-platform
      cancel-in-progress: false

    outputs:
      resource_group: ${{ steps.names.outputs.resource_group }}
      function_app: ${{ steps.names.outputs.function_app }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Shaped like the JSON in terraform.tfvars.example.
      - name: Write terraform.tfvars.json
        env:
          TF_VARS_JSON: ${{ secrets.TF_VARS_JSON }}
        run: printf '%s' "$TF_VARS_JSON" > terraform.tfvars.json

      - name: Terraform Init
        run: terraform init -no-color -input=false

      - name: Terraform Plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -out=tfplan | tee plan.txt

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: terraform apply -no-color -input=false -auto-approve tfplan

      - name: Read resource names
        id: names
        if: github.event_name == 'push' || github.event.inputs.action == 'apply'
        run: |
          echo "resource_group=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "function_app=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          ACTION: ${{ github.event.inputs.action || 'apply' }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### SBOM Platform ${ACTION}: ${STATUS}"
            grep -E '^(Plan:|No changes)' plan.txt 2>/dev/null || echo "No plan was produced."
            echo
            echo "Commit \`${GITHUB_SHA}\`, run by @${GITHUB_ACTOR}"
          } >> "$GITHUB_STEP_SUMMARY"

  collector-deploy:
    name: Deploy SBOM collector
    needs: terraform
    if: github.event_name == 'push' || github.event.inputs.action == 'apply'
    runs-on: cps-ubuntu-latest-private

    concurrency:
      group: sbom-collector
      cancel-in-progress: false

    env:
      RG: ${{ needs.terraform.outputs.resource_group }}
      FUNC: ${{ needs.terraform.outputs.function_app }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # must match the Function App runtime_version

      # Linux wheels whatever the runner is; other wheels deploy but don't load.
      - name: Package
        run: |
          PKG="$RUNNER_TEMP/collector"
          rm -rf "$PKG" && mkdir -p "$PKG"
          rsync -a --exclude-from=sbom-collector/.funcignore --exclude=.funcignore --exclude=.python_packages \
            sbom-collector/ "$PKG/"
          python -m pip install -q --target "$PKG/.python_packages/lib/site-packages" -r sbom-collector/requirements.txt \
            --platform manylinux2014_x86_64 --platform manylinux_2_17_x86_64 --python-version 3.11 \
            --implementation cp --only-binary=:all:
          python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', sys.argv[2])" "$RUNNER_TEMP/collector" "$PKG"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: az functionapp deployment source config-zip -g "$RG" -n "$FUNC" --src "$RUNNER_TEMP/collector.zip" -o none

      # A package that doesn't load still uploads fine, so check.
      - name: Check the functions loaded
        run: |
          for _ in $(seq 1 20); do
            names=$(az functionapp function list -g "$RG" -n "$FUNC" --query "[].name" -o tsv 2>/dev/null || true)
            if [ "$(grep -cE 'enumerate_repos|collect_sbom|report_poison_depth' <<<"$names")" -eq 3 ]; then
              echo "Loaded:"; echo "$names"; exit 0
            fi
            sleep 15
          done
          echo "::error::$FUNC lists no collector functions 5 minutes after the deploy. Check Application Insights for ModuleNotFoundError (docs/how-to-use.md, Troubleshooting)."
          exit 1
