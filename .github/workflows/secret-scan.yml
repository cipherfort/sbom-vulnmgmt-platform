name: Reusable Secret Scan

# Called from other repos as:
#   uses: cipherfort/sbom-vulnmgmt-platform/.github/workflows/secret-scan.yml@main
#   with:
#     defectdojo_url: ${{ vars.DEFECTDOJO_URL }}                    # omit to skip the DefectDojo import
#     defectdojo_product_name: ${{ vars.DEFECTDOJO_PRODUCT_NAME }}
#   secrets:
#     defectdojo_api_key: ${{ secrets.DEFECTDOJO_API_KEY }}
#
# Runs the gitleaks CLI directly rather than a wrapper action — this
# platform's dual-write pattern needs to own the exact SARIF file path,
# and gitleaks' own GitHub Action is built around a different flow (PR
# comments, its own artifact upload) rather than handing back a clean file.
#
# Dual-write, same pattern as sbom-scan.yml/image-scan.yml: SARIF goes to
# the repo's own GitHub Security tab AND to DefectDojo, so DefectDojo stays
# the single pane across every finding type, not just Dependency-Track's.

on:
  workflow_call:
    inputs:
      defectdojo_url:
        description: "Leave unset to skip the DefectDojo import job entirely"
        type: string
        default: ""
      defectdojo_product_name:
        type: string
        default: ""
    secrets:
      defectdojo_api_key:
        required: false

jobs:
  secret-scan:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans commit history, not just the working tree

      # Observability-first, same stance as the rest of this platform: never
      # fails the job on findings (--exit-code 0). Severity-based gating is a
      # deliberate follow-up decision, not baked in here.
      - name: Gitleaks scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --report-format=sarif --report-path=/repo/gitleaks-results.sarif --exit-code=0

      - uses: actions/upload-artifact@v4
        with:
          name: gitleaks-${{ github.sha }}
          path: gitleaks-results.sarif
          retention-days: 30

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

      - name: Import SARIF into DefectDojo
        if: inputs.defectdojo_url != ''
        run: |
          set -euo pipefail
          curl -sf -X POST "${{ inputs.defectdojo_url }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.defectdojo_api_key }}" \
            -F "scan_type=SARIF" \
            -F "file=@gitleaks-results.sarif" \
            -F "product_name=${{ inputs.defectdojo_product_name }}" \
            -F "engagement_name=secret-scan-${{ github.sha }}" \
            -F "active=true" \
            -F "verified=true" \
            -F "close_old_findings=true"
