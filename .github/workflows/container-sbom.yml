name: Reusable Container Image SBOM

# Reusable, optional: submits an image's SBOM to the dependency graph, so the
# collector picks it up with the repo's other dependencies. Call it from the
# default-branch build, with contents: write. See examples/consumer-workflows/container-image.yml.

on:
  workflow_call:
    inputs:
      image:
        description: "Image reference to scan, ideally by digest"
        type: string
        required: true
      acr_login:
        description: "Log into an Azure Container Registry before scanning (needed for private ACR images)"
        type: boolean
        default: false
      acr_name:
        description: "ACR name (without .azurecr.io) — required if acr_login is true"
        type: string
        default: ""
      runs_on:
        type: string
        default: cps-ubuntu-latest-private
    secrets:
      azure_client_id:
        required: false
      azure_tenant_id:
        required: false
      azure_subscription_id:
        required: false

jobs:
  container-sbom:
    name: Image SBOM to dependency graph
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
      id-token: write # azure/login OIDC, only used when acr_login is true

    steps:
      - uses: azure/login@v2
        if: inputs.acr_login
        with:
          client-id: ${{ secrets.azure_client_id }}
          tenant-id: ${{ secrets.azure_tenant_id }}
          subscription-id: ${{ secrets.azure_subscription_id }}

      - name: ACR login
        if: inputs.acr_login
        run: az acr login --name "${{ inputs.acr_name }}"

      - name: Syft SBOM and dependency snapshot
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ inputs.image }}
          format: spdx-json
          dependency-snapshot: true
          artifact-name: image-sbom-${{ github.run_id }}.spdx.json
          upload-release-assets: false
