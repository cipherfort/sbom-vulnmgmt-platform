name: Reusable Container Image Scan

# Reusable: Trivy scan of container images, results in the calling repo's
# Security tab. Private repos need GitHub Code Security for the upload.
#   uses: <org>/<repo>/.github/workflows/image-scan.yml@main
#   permissions: { security-events: write }
#   with: { image_refs: '["myacr.azurecr.io/app:1.2.3"]', acr_login: true, acr_name: myacr }

on:
  workflow_call:
    inputs:
      image_refs:
        description: 'JSON array of image references to scan, e.g. ["myacr.azurecr.io/app:1.2.3"]'
        type: string
        required: true
      acr_login:
        description: "Log into an Azure Container Registry before scanning (needed for private images)"
        type: boolean
        default: false
      acr_name:
        description: "ACR name (without .azurecr.io) — required if acr_login is true"
        type: string
        default: ""
    secrets:
      azure_client_id:
        required: false
      azure_tenant_id:
        required: false
      azure_subscription_id:
        required: false

jobs:
  image-scan:
    name: Trivy scan — ${{ matrix.image }}
    runs-on: cps-ubuntu-latest-private
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.image_refs) }}

    steps:
      - uses: azure/login@v2
        if: inputs.acr_login
        with:
          client-id: ${{ secrets.azure_client_id }}
          tenant-id: ${{ secrets.azure_tenant_id }}
          subscription-id: ${{ secrets.azure_subscription_id }}

      - name: ACR login
        if: inputs.acr_login
        run: az acr login --name ${{ inputs.acr_name }}

      # Reports findings; never fails the job on them.
      - name: Trivy scan
        # Pinned by SHA: trivy-action's tags were hijacked in March 2026 (CVE-2026-33634).
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      - uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ strategy.job-index }}-${{ github.sha }}
          path: trivy-results.sarif
          retention-days: 30

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ strategy.job-index }}
