# Local proof of concept: Dependency-Track and an Azure Storage emulator.
# The collector runs on the host (poc/poc.py, or `func start`). See poc/README.md.
name: sbom-poc

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    # --skipApiVersionCheck: the storage SDKs in requirements.txt can be newer than the emulator.
    command: >
      azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
      --location /data --loose --skipApiVersionCheck
    ports: ["10000:10000", "10001:10001", "10002:10002"]
    volumes: ["azurite:/data"]

  dtrack-apiserver:
    # Same version as var.dtrack_image_tag; embedded H2 database instead of Postgres.
    image: dependencytrack/apiserver:4.14.6
    environment:
      EXTRA_JAVA_OPTIONS: -Xmx4g
    deploy:
      resources:
        limits: { memory: 5g }
    ports: ["8081:8080"]
    volumes: ["dtrack-data:/data"]
    restart: unless-stopped

  dtrack-frontend:
    image: dependencytrack/frontend:4.14.6
    environment:
      API_BASE_URL: http://localhost:8081
    ports: ["8080:8080"]
    depends_on: [dtrack-apiserver]
    restart: unless-stopped

volumes:
  azurite:
  dtrack-data:
